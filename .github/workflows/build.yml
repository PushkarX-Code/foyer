name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: ./gradlew assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk foyer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: foyer-apk
          path: foyer.apk
      - name: Publish as the latest download
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest foyer.apk --target "$GITHUB_SHA" --latest \
            --title "Foyer build ${GITHUB_RUN_NUMBER}" \
            --notes "Built from ${GITHUB_SHA::7}. Install with the Downloader app on the TV."
